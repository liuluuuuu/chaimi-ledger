<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">   <!-- 经 /static/home.html 访问时无服务端 base 注入：自备相对基（/home 路由注入的 base 在前，同样指向应用根） -->
<title>选择用户 · 柴米记账</title>
<link rel="stylesheet" href="static/base.css">
<script type="module" src="static/theme.js"></script>   <!-- 三态主题（浅/深/自动·飞牛宿主跟随），与 app.html 共用 -->
<style>
/* ===== 登录/用户选择页：≤768px 竖排、宽屏左品牌右操作。
   lg-* 样式只在本页使用（app.html 不携带）。 ===== */
/* 手机：自然文档流 + 水平居中（margin auto）。旧版 body 定高弹性居中会把超高内容
   垂直居中——顶部溢出不可滚动（用户列表一长首屏元素够不着） */
body{background:var(--bg)}
.lg-wrap{display:flex;width:100%;max-width:420px;min-height:100vh;flex-direction:column;margin:0 auto}
.lg-brand{display:none}
.lg-panel{flex:1;display:flex;flex-direction:column;padding:40px 30px;overflow-y:auto}
.lg-panel>*{flex-shrink:0}   /* 高度不够改滚动：按钮/输入框/用户卡是纵向 flex 子项，默认可被压扁 */
.lg-panel::before,.lg-panel::after{content:"";flex:1 0 0}   /* 上下弹性占位：有余量时垂直居中，
   超高时归零贴顶可从头滚（justify-content:center 会把首行顶出滚动区；auto 边距落在
   桌面端隐藏的 .lg-mhead 上不生效——内容贴顶的根因） */
.lg-mhead{display:flex;flex-direction:column;margin-bottom:26px}
.lg-mhead img{width:72px;height:72px;border-radius:20px;box-shadow:var(--shadow)}
.lg-h1{font-size:22px;font-weight:700;margin-bottom:8px;color:var(--fg)}
.lg-sub{font-size:13.5px;color:var(--muted);line-height:1.75}
.lg-label{font-size:12.5px;color:var(--muted);margin:24px 0 8px;display:flex;justify-content:space-between}
.lg-req{color:var(--m-peach-fg)}
.lg-input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);padding:0 14px;font-size:16px;color:var(--fg);outline:none;font-family:inherit}
.lg-input:focus{border-color:var(--primary)}
.lg-input.lg-err{border-color:var(--m-peach)}
.lg-avatars{display:flex;gap:12px;margin-top:10px}
.lg-avpick{width:64px;height:64px;border-radius:18px;border:2px solid transparent;background:var(--card);
  cursor:pointer;padding:3px;box-shadow:var(--shadow);font-family:inherit}
.lg-avpick img{width:100%;height:100%;border-radius:14px;display:block}
.lg-avpick.on{border-color:var(--primary);background:var(--primary-bg)}
.lg-avimg{width:46px;height:46px;border-radius:13px;flex:none}
.lg-go{width:100%;height:48px;border:none;border-radius:var(--radius-sm);background:var(--primary);
  color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:32px;font-family:inherit}
.lg-go:active{background:var(--primary-bg);color:var(--m-blue-fg)}
.lg-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.lg-back{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;
  text-align:left;padding:0;font-family:inherit}
.lg-back:hover{color:var(--fg)}
.lg-ulist{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.lg-uitem{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  width:100%;font-family:inherit}
.lg-uitem:hover{background:var(--hover)}
.lg-uinfo{flex:1;min-width:0}
.lg-uname{font-size:15.5px;font-weight:600;color:var(--fg);display:block}
.lg-umeta{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lg-uarrow{color:var(--muted);font-size:16px}
.lg-uadd{border:1.5px dashed var(--border);background:transparent;justify-content:center;color:var(--muted);box-shadow:none}
.lg-uadd:hover{color:var(--primary);border-color:var(--primary);background:transparent}
.lg-lbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lg-lb{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-pill);
  padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.lg-lb.on{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-2);font-weight:600}
.lg-lb:hover{background:var(--hover)}
#lgToast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;
  transition:all .25s;pointer-events:none;z-index:9}
#lgToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#lgToast.err{background:var(--expense);color:#fff}   /* ok=false 报错样式（与 core.js msg 语义对齐） */
@media(min-width:769px){
  /* 桌面布局与主应用同款（base.css .sidebar/.main）：左=窗口灰（app 侧栏底色），
     右=灰底上的描边圆角内容卡片（上/右/下 10px 留白、左缘贴齐，如 app 的 .main） */
  .lg-wrap{flex-direction:row;width:100%;max-width:none;height:100vh;min-height:0;background:var(--win);overflow:hidden}
  .lg-brand{flex:0 0 41%;display:flex;flex-direction:column;justify-content:center;padding:0 5.5vw;
    position:relative;overflow:hidden;background:var(--win)}
  .lg-brand>*{flex-shrink:0}   /* 与 .lg-panel 同款：窗口过矮时图标/标题不压缩 */
  .lg-icon{width:88px;height:88px;border-radius:24px;box-shadow:var(--shadow-lg);position:relative}
  .lg-name{font-size:27px;font-weight:700;margin-top:24px;position:relative;color:var(--fg)}
  .lg-tag{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.9;position:relative}
  .lg-tag span{white-space:nowrap}   /* 短语不可拆：宽度不够时只在「·」分隔处换行，不出现「记一/笔」这类拆词 */
  .lg-panel{flex:1;display:flex;flex-direction:column;align-items:center;padding:48px 5vw;
    margin:10px 10px 10px 0;border:1px solid var(--border);border-radius:var(--radius-panel);background:var(--panel)}
  .lg-panel>*{width:100%;max-width:420px}   /* 表单/列表一列居中，不贴左 */
  .lg-mhead{display:none}   /* 宽屏品牌区已有图标标题 */
}
/* ===== 分类编辑抽屉（内容复用 catmgr.js） ===== */
.cat-drawer-mask{position:fixed;inset:0;background:var(--mask);z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:16px}
.cat-drawer-mask.on{display:flex}
.cat-drawer{background:var(--card);border:1px solid var(--border);border-radius:22px;width:100%;max-width:560px;
  max-height:84vh;display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(31,36,51,.08),0 16px 48px rgba(31,36,51,.12);animation:catDrawerIn .22s ease}
@keyframes catDrawerIn{from{transform:translateY(40px);opacity:0}}
.cat-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.cat-drawer-btn{border:1px solid var(--border);background:none;color:var(--fg);border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.cat-drawer-btn:hover{background:var(--hover)}
.cat-drawer-body{padding:20px;overflow-y:auto}
.cat-drawer-body .cm-group:first-child{margin-top:0}   /* 首组外距并入 20px 内距：抽屉上下留空对称 */
.cat-drawer-body .cm-cat:last-child{margin-bottom:0}
</style>
<script>/* 首帧门控（规则在 base.css gate-hold，期间盖启动画面）：判定完成前不显示页面——
   自动进入者全程只见启动画面（「正在加载…」不闪现），停留者一次性干净出现。
   放行点=render()（boot 一切出口），4s 兜底亮出加载/失败态 */
try{
  document.documentElement.classList.add("gate-hold");
  setTimeout(() => gateLift(), 4000);   // 须包箭头：此时 theme-boot.js 尚未加载，裸传 gateLift 求值即 ReferenceError（被 catch 吞掉、兜底从未注册），app.html 同款已注明此坑
}catch(_){}</script>
</head>
<body data-theme="light">
<script src="static/theme-boot.js"></script>   <!-- 主题先行（防闪白/闪黑），与 app.html 共用 -->
  <div class="lg-wrap">
    <div class="lg-brand">
      <img class="lg-icon" src="images/icon-256.png" alt="柴米记账">
      <div class="lg-name">柴米记账</div>
      <div class="lg-tag"><span>家人共用的记账本</span> · <span>多账本</span> · <span>账单导入</span> · <span>AI 记一笔</span><br>数据全在你的 NAS 上</div>
    </div>
    <div class="lg-panel" id="lgPanel"><div class="lg-sub">正在加载…</div></div>
  </div>
  <div id="lgToast"></div>
  <!-- 分类编辑抽屉：内容复用 catmgr.js（与设置页分类管理同源）；「分类来自」选中即应用，编辑直接改当前生效的分类 -->
  <div class="cat-drawer-mask" id="catDrawer" onclick="if(event.target===this)closeCatDrawer()">
    <div class="cat-drawer">
      <div class="cat-drawer-head">
        <b>编辑分类</b>
        <span style="display:flex;align-items:center;gap:8px">
          <button type="button" id="catEditBtn" class="cat-drawer-btn" onclick="toggleCatEdit()">编辑</button>
          <button type="button" class="cat-drawer-btn" onclick="closeCatDrawer()" title="关闭">✕</button>
        </span>
      </div>
      <div class="cat-drawer-body"><div id="catMgr" class="catmgr-root"></div></div>
    </div>
  </div>
<script src="static/shared-lite.js"></script>   <!-- $/esc/qEsc/api/apiSend 最小工具集（与 core.js 同口径单源） -->
<script src="static/catmgr.js"></script>
<script>
/* 独立登录页：/ 入口看设备记忆（Cookie，读写见 shared-lite.js）——记着有效用户的设备
   直接拿到主界面，不经过本页；没记忆或记忆失效才 302 到这里选人/建用户（老版本升级后
   第一次打开也停在这里，点一次用户即写入 Cookie，不搬旧记录）。本页保留自动进入
   （?pick=1 显式选人时跳过）给直达场景（书签直开本页等）。选定/创建后写
   chaimi_user_{账本id} 并进 /app。无 core.js 依赖，基础工具由 shared-lite.js 提供，
   此处只留本页专属的 toast。 */
let _toastT = null;
function msg(t, ok=true){
  // 签名与 core.js msg(t, ok) 对齐：catmgr 共享模块按 (text, false) 报错，home 此前
  // 单参实现让错误 toast 永远中性样式（API 口径漂移）；ok=false 红字示警
  const el = $("#lgToast"); el.textContent = t;
  el.classList.toggle("err", ok === false);
  el.classList.add("on");
  clearTimeout(_toastT); _toastT = setTimeout(()=>el.classList.remove("on"), 2600);
}

let LEDGER = 0, LNAME = "", USERS = [], SAVED = 0, LEDGERS = [];

async function boot(){
  try{
    const qp = new URLSearchParams(location.search);
    let want = +qp.get("ledger") || 0;   // 目标账本：URL 指定优先
    if(!want) want = +ckGet("chaimi_ledger") || 0;   // 其次上次使用（与 app loadAll 选账本同口径）
    const ls = await api("api/ledgers");
    if(!ls.length){ render(newLedgerHtml()); return; }   // 无账本（新飞牛用户/全新安装）：先建账本，不再跳回主应用（会成环）
    LEDGERS = ls;
    const cur = ls.find(l => l.id === want) || ls[0];
    LEDGER = cur.id; LNAME = cur.name;
    SAVED = savedUser(LEDGER);
    // 账本列表→用户列表串行取。常规冷启动已不经过本页（/ 入口服务端判定直出 app），
    // 到这里的都是少数场景，不为省一个来回做请求预取（老方案的提速已随入口改版移除）
    USERS = await api(`api/attribution-groups?ledger=${LEDGER}`);
    /* 本机已记录有效用户→自动直入 app（书签直开本页等直达场景走这条）；
       ?pick=1 显式选人（app 顶栏「切换用户」入口）不自动进入，否则一进 home 又被弹回原用户 */
    if(!qp.get("pick") && USERS.some(g => g.id === SAVED)){ enter(SAVED); return; }
    render(USERS.length ? selHtml() : setupHtml(false));
  }catch(e){ render(`<div class="lg-sub">加载失败：${esc(e.message)}</div>`); }   // 经 render 放行（首帧门控）
}
/* 账本选择行：
   两态（选用户/建用户）共用，点击切换目标账本并重拉其用户（enter 写 chaimi_ledger/chaimi_user 都以 LEDGER 为准，闭环） */
function ledBar(){
  return `<div class="lg-lbs">${LEDGERS.map(l =>
    `<button class="lg-lb${l.id===LEDGER?" on":""}" onclick="switchLedger(${l.id})">${l.icon?esc(l.icon)+" ":""}${esc(l.name)}</button>`).join("")}</div>`;
}
async function switchLedger(id){
  if(id === LEDGER) return;
  LEDGER = id; LNAME = LEDGERS.find(l=>l.id===id)?.name || "";
  SAVED = savedUser(id);
  render(`<div class="lg-sub">加载中…</div>`);
  // 账本守卫（ledgerScope 单源，身份源是本页模块变量 LEDGER）：快速连点两个账本时慢的
  // 旧响应若直接写入 USERS，界面会显示 A 账本用户、LEDGER 却是 B，此后 enter(id) 会把
  // A 的用户写进 B 的存储键。守卫放在 USERS 赋值之前，旧响应连全局都不污染
  const sc = ledgerScope(() => LEDGER);
  let us = [];
  try{ us = await api(`api/attribution-groups?ledger=${sc.id}`); }catch(_){}
  if(!sc.isCurrent()) return;
  USERS = us;
  render(USERS.length ? selHtml() : setupHtml(false));
}
const savedUser = id => +ckGet("chaimi_user_" + id) || 0;   // 上次使用用户（没记过/禁 Cookie 为 0），boot/switchLedger 共用
function render(html){
  $("#lgPanel").innerHTML = html;
  gateLift();   // 首帧判定出口：渐隐揭掉启动画面（boot 成功/失败都经此；自动进入不经过=画面盖到跳转）
}
function head(){ return `<div class="lg-mhead"><img src="images/icon-256.png" alt=""></div>`; }
/* 状态 C：一本账本都没有（新飞牛用户/全新安装）——先建账本再进建用户流程 */
function newLedgerHtml(){
  return `${head()}
    <div class="lg-h1">欢迎使用 👋</div>
    <div class="lg-sub">还没有账本，先建一本——日常 / 旅行 / 装修都可以，之后在设置页还能继续添加。</div>
    <div class="lg-label"><span>账本名</span></div>
    <input id="lg_ledger_name" class="lg-input" placeholder="如：日常" oninput="this.classList.remove('lg-err')">
    <button class="lg-go" onclick="createLedger()">创建账本 →</button>
    <div class="lg-foot">创建后设置第一个记账用户</div>`;
}
async function createLedger(){
  try{
    const name = ($("#lg_ledger_name").value || "").trim() || "日常";
    const r = await apiSend("api/ledgers", "POST", {name, currency: "CNY"});
    ckSet("chaimi_ledger", r.id);
    LEDGER = r.id; LNAME = name; LEDGERS = [{id: r.id, name, icon: ""}];
    render(setupHtml(false));   // 建完账本接着走「设置第一个用户」
  }catch(e){ msg(e.message); }
}
let lgAvatar = "f";
let lgFromList = false;
function catFromHtml(fromList){   // 「分类来自」：新账本首用户流程且有历史账本时才显示
  // （全新安装无可复用；fromList=给已有账本补用户，非新建场景不换分类）
  const others = fromList ? [] : LEDGERS.filter(l => l.id !== LEDGER);
  if(!others.length) return "";
  return `<div class="lg-label"><span>分类来自</span></div>
    <div style="display:flex;gap:8px">
      <!-- min-width:0：flex 子项默认最小宽=内容（select 即最长 option 文本），不放开则
           窄屏压不扁本行、「编辑」按钮被挤出屏外不可点；select 自身会截断长文案 -->
      <select id="lg_cat_from" class="lg-input" style="flex:1 1 auto;width:auto;min-width:0" data-applied="" onchange="applyCatFrom(this)">
        <option value="">默认分类（已就绪）</option>
        ${others.map(l => `<option value="${l.id}">复用「${esc(l.name)}」的分类与来源映射</option>`).join("")}
      </select>
      <button type="button" class="lg-input" style="flex:none;width:auto;padding:0 16px;cursor:pointer" onclick="openCatDrawer()">编辑</button>
    </div>`;
}
function setupHtml(fromList){   // 状态 A：设置用户名（必填）+ 头像；fromList=从选择页「＋新建用户」进入
  lgAvatar = "f";
  lgFromList = !!fromList;
  return `${head()}
    ${ledBar()}
    ${fromList ? `<button class="lg-back" onclick="back()">‹ 返回选择用户</button>` : ""}
    <div class="lg-h1">欢迎使用${fromList ? "" : " 👋"}</div>
    <div class="lg-sub">${fromList
      ? "填写用户名创建新用户；不填直接点「开始记账」则沿用上次用户进入。"
      : "先设置一个用户名——记账会默认记在当前用户名下，家人可稍后在「设置 → 用户设置」里添加。"}</div>
    <div class="lg-label"><span>头像</span></div>
    <div class="lg-avatars">
      <button type="button" class="lg-avpick" data-av="m" onclick="pickAv(this)"><img src="${avatarUrl("m")}" alt="男牛牛"></button>
      <button type="button" class="lg-avpick on" data-av="f" onclick="pickAv(this)"><img src="${avatarUrl("f")}" alt="女牛牛"></button>
    </div>
    <div class="lg-label"><span>用户名</span>${fromList ? "" : '<span class="lg-req">必填</span>'}</div>
    <input id="lg_name" class="lg-input" placeholder="如：老公 / 老婆 / 我" oninput="this.classList.remove('lg-err')">
    ${catFromHtml(fromList)}
    <button class="lg-go" onclick="create()">开始记账 →</button>
    <div class="lg-foot">头像可稍后在「设置 → 用户设置」里更换</div>`;
}
function pickAv(btn){
  lgAvatar = btn.dataset.av;
  document.querySelectorAll(".lg-avpick").forEach(b=>b.classList.toggle("on", b===btn));
}
function selHtml(){   // 状态 B：选择用户（上次使用的排最前并标注）
  const gs = [...USERS].sort((a,b)=>(b.id===SAVED)-(a.id===SAVED));
  return `${head()}
    ${ledBar()}
    <div class="lg-h1">选择用户</div>
    <div class="lg-sub">选择记账人进入「${esc(LNAME)}」（每个账本的用户独立）。</div>
    <div class="lg-ulist">
      ${gs.map(g=>`
      <button class="lg-uitem" onclick="enter(${g.id})">
        <img class="lg-avimg" src="${avatarUrl(g.avatar)}" alt="">
        <span class="lg-uinfo"><span class="lg-uname">${esc(g.name)}</span>
          <span class="lg-umeta">${g.id===SAVED ? "上次使用 · " : ""}${g.members ? esc(g.members) : "暂无账单归属"}</span></span>
        <span class="lg-uarrow">›</span>
      </button>`).join("")}
      <button class="lg-uitem lg-uadd" onclick="newUser()">＋ 新建用户</button>
    </div>
    <div class="lg-foot" style="margin-top:18px">选择后记住在本设备，下次直接进入记账页</div>`;
}
const back = () => render(selHtml());
const newUser = () => render(setupHtml(true));
function enter(id){
  // 主应用 loadAll 首载读它恢复——修复「新账本建用户，进入后却回到旧账本」
  ckSet("chaimi_user_" + LEDGER, id);
  ckSet("chaimi_ledger", LEDGER);
  if(ckGet("chaimi_user_" + LEDGER) !== String(id)){   // 没写进去（浏览器禁了 Cookie）
    msg("本浏览器禁用了 Cookie，无法记住用户，请更换浏览器或关闭隐私模式"); return;
  }
  location.replace("app");   // 进 /app：它不做入口判定，一定给主界面，并由服务端把刚写的记忆重发一遍续期
}
async function create(){
  const name = $("#lg_name").value.trim();
  if(!name){
    if(lgFromList && USERS.length){
      enter((USERS.find(g=>g.id===SAVED) || USERS[0]).id);
      return;
    }
    $("#lg_name").classList.add("lg-err"); return msg("请设置用户名");
  }
  try{
    const r = await apiSend(`api/attribution-groups?ledger=${LEDGER}`, "POST", {name, avatar: lgAvatar});
    enter(r.id);
  }catch(e){ msg(e.message); }
}
function openCatDrawer(){   /* 打开即拉当前账本分类（初始=默认分类或已应用来源） */
  $("#catDrawer").classList.add("on");
  loadCatMgr();
}
function closeCatDrawer(){
  $("#catDrawer").classList.remove("on");
  if(catEdit.on) toggleCatEdit();   /* 收起时退出编辑态，下次打开视图干净 */
}
async function applyCatFrom(sel){   /* 选中即应用（WYSIWYG）：编辑抽屉改的就是当前生效的分类；失败回滚选项 */
  const v = +sel.value || null;
  try{
    await apiSend(`api/ledgers/${LEDGER}/category-source`, "PUT", {from: v});
    sel.dataset.applied = sel.value;
    msg(v ? "已应用所选账本的分类与映射" : "已恢复默认分类");
    if($("#catDrawer").classList.contains("on")) loadCatMgr();   /* 抽屉开着：所见须为当前生效分类 */
  }catch(e){ sel.value = sel.dataset.applied ?? ""; msg("应用失败：" + e.message); }
}
/* ===== 手机物理返回键：先关顶层浮层（新建分类 > 编辑抽屉），无浮层再退出 =====
   core.js navTopModal/popstate 守卫的单屏简化版：浮层开启不 pushState，popstate
   先关浮层并补位一帧——home 是 webview 首帧，不垫帧时第一个返回键就把页面弹出
   去（「抽屉开着按返回直接退出应用」的根因）。浮层经 ✕/遮罩关闭不动历史，自然回落 */
function homeTopLayer(){
  const cn = catNewLayer();   // catmgr 单源：懒构建判空+关闭配对（app 侧 navTopModal 共用）
  if(cn) return cn;
  if($("#catDrawer").classList.contains("on")) return () => closeCatDrawer();
  return null;
}
window.addEventListener("popstate", () => {
  const m = homeTopLayer();
  if(m){ m(); history.pushState({chaimiGuard:1}, ""); return; }   // 关顶层浮层+补位：下个返回键仍有帧可落
  if(history.state?.chaimiGuard) return;   // 落在垫帧上（如刷新后再返回）：页面不动（core.js 同款）
  msg("再按一次退出应用");   // 垫帧已弹尽：本次无动作，下次返回=退出（与 app 侧口径一致）
});
window.addEventListener("keydown", e => {   // 桌面 Esc 与物理返回键同层：先关顶层浮层（app 侧 Esc 栈同款语义）
  if(e.key !== "Escape") return;
  const m = homeTopLayer();
  if(m) m();
});
history.pushState({chaimiGuard:1}, "");   // 首帧垫一层：返回键先落到 popstate 守卫
boot();
</script>
