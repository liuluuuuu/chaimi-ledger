<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">   <!-- 经 /static/home.html 访问时无服务端 base 注入：自备相对基（/home 路由注入的 base 在前，同样指向应用根） -->
<title>选择用户 · 柴米记账</title>
<link rel="stylesheet" href="static/base.css">
<style>
/* ===== 登录/用户选择页：≤768px 竖排、宽屏左品牌右操作。
   lg-* 样式只在本页使用（app.html 不携带）。 ===== */
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lg-wrap{display:flex;width:100%;max-width:420px;min-height:100vh;flex-direction:column;background:var(--bg)}
.lg-brand{display:none}
.lg-panel{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 30px}
.lg-mhead{display:flex;flex-direction:column;margin-bottom:26px}
.lg-mhead img{width:72px;height:72px;border-radius:20px;box-shadow:var(--shadow)}
.lg-h1{font-size:22px;font-weight:700;margin-bottom:8px;color:var(--fg)}
.lg-sub{font-size:13.5px;color:var(--muted);line-height:1.75}
.lg-label{font-size:12.5px;color:var(--muted);margin:24px 0 8px;display:flex;justify-content:space-between}
.lg-req{color:var(--m-peach-fg)}
.lg-input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  background:var(--card);padding:0 14px;font-size:16px;color:var(--fg);outline:none;font-family:inherit}
.lg-input:focus{border-color:var(--primary)}
.lg-input.lg-err{border-color:var(--m-peach)}
.lg-avatars{display:flex;gap:12px;margin-top:10px}
.lg-avpick{width:64px;height:64px;border-radius:18px;border:2px solid transparent;background:var(--card);
  cursor:pointer;padding:3px;box-shadow:var(--shadow);font-family:inherit}
.lg-avpick img{width:100%;height:100%;border-radius:14px;display:block}
.lg-avpick.on{border-color:var(--primary);background:var(--primary-bg)}
.lg-avimg{width:46px;height:46px;border-radius:13px;flex:none}
.lg-go{width:100%;height:48px;border:none;border-radius:var(--radius-sm);background:var(--primary);
  color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:32px;font-family:inherit}
.lg-go:active{background:var(--primary-bg);color:var(--m-blue-fg)}
.lg-foot{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.lg-back{border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;
  text-align:left;padding:0;font-family:inherit}
.lg-back:hover{color:var(--fg)}
.lg-ulist{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.lg-uitem{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;
  width:100%;font-family:inherit}
.lg-uitem:hover{background:var(--hover)}
.lg-uinfo{flex:1;min-width:0}
.lg-uname{font-size:15.5px;font-weight:600;color:var(--fg);display:block}
.lg-umeta{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lg-uarrow{color:var(--muted);font-size:16px}
.lg-uadd{border:1.5px dashed var(--border);background:transparent;justify-content:center;color:var(--muted);box-shadow:none}
.lg-uadd:hover{color:var(--primary);border-color:var(--primary);background:transparent}
.lg-lbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lg-lb{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-pill);
  padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit}
.lg-lb.on{background:var(--primary-bg);color:var(--primary-fg);border-color:var(--primary-2);font-weight:600}
.lg-lb:hover{background:var(--hover)}
#lgToast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;
  transition:all .25s;pointer-events:none;z-index:9}
#lgToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:769px){
  .lg-wrap{flex-direction:row;width:100%;max-width:none;height:100vh;min-height:0;background:var(--card);overflow:hidden}
  .lg-brand{flex:0 0 41%;display:flex;flex-direction:column;justify-content:center;padding:0 5.5vw;position:relative;
    overflow:hidden;background:linear-gradient(160deg,var(--m-blue-50) 0%,#F3EEFE 100%)}
  .lg-blob{position:absolute;border-radius:50%;opacity:.5}
  .lg-blob.b1{width:220px;height:220px;background:var(--m-blue-50);right:-70px;top:-60px}
  .lg-blob.b2{width:150px;height:150px;background:#FBEBF0;right:40px;bottom:-50px}
  .lg-blob.b3{width:90px;height:90px;background:var(--m-mint-50);left:-24px;bottom:70px}
  .lg-icon{width:88px;height:88px;border-radius:24px;box-shadow:var(--shadow-lg);position:relative}
  .lg-name{font-size:27px;font-weight:700;margin-top:24px;position:relative;color:var(--fg)}
  .lg-tag{margin-top:12px;color:var(--muted);font-size:14px;line-height:1.9;position:relative;max-width:300px}
  .lg-panel{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 5vw}
  .lg-panel>*{width:100%;max-width:420px}   /* 表单/列表一列居中，不贴左 */
  .lg-mhead{display:none}   /* 宽屏品牌区已有图标标题 */
}
</style>
</head>
<body data-theme="light">
  <div class="lg-wrap">
    <div class="lg-brand">
      <div class="lg-blob b1"></div><div class="lg-blob b2"></div><div class="lg-blob b3"></div>
      <img class="lg-icon" src="images/icon-256.png" alt="柴米记账">
      <div class="lg-name">柴米记账</div>
      <div class="lg-tag">家人共用的记账本 · 多账本 · 账单导入 · AI 记一笔<br>数据全在你的 NAS 上</div>
    </div>
    <div class="lg-panel" id="lgPanel"><div class="lg-sub">正在加载…</div></div>
  </div>
  <div id="lgToast"></div>
<script>
/* 独立登录页：服务端入口（GET / 发现无账本）或主应用检测到「无当前用户」（首次/缓存
   失效）跳过来，选定/创建用户后写 chaimi_user_{账本id} 并回主应用。无 core.js 依赖，自带最小工具。 */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path, opts){
  const r = await fetch(path.replace(/^\//, ""), opts);   // 相对路径，经 <base> 兼容网关前缀/直连
  if(!r.ok){ let e = "请求失败"; try{ e = (await r.json()).detail || e }catch(_){} throw new Error(e); }
  return r.json();
}
const apiSend = (path, method, body) => api(path, {method, headers:{"Content-Type":"application/json"},
  body: JSON.stringify(body)});
let _toastT = null;
function msg(t){
  const el = $("#lgToast"); el.textContent = t; el.classList.add("on");
  clearTimeout(_toastT); _toastT = setTimeout(()=>el.classList.remove("on"), 2600);
}

let LEDGER = 0, LNAME = "", USERS = [], SAVED = 0, LEDGERS = [];

async function boot(){
  try{
    const ls = await api("api/ledgers");
    if(!ls.length){ render(newLedgerHtml()); return; }   // 无账本（新飞牛用户/全新安装）：先建账本，不再跳回主应用（会成环）
    LEDGERS = ls;
    const qp = +new URLSearchParams(location.search).get("ledger") || 0;
    const cur = ls.find(l => l.id === qp) || ls[0];
    LEDGER = cur.id; LNAME = cur.name;
    try{ SAVED = +localStorage.getItem("chaimi_user_" + LEDGER) || 0; }catch(_){}
    USERS = await api(`api/attribution-groups?ledger=${LEDGER}`);
    render(USERS.length ? selHtml() : setupHtml(false));
  }catch(e){ $("#lgPanel").innerHTML = `<div class="lg-sub">加载失败：${esc(e.message)}</div>`; }
}
/* 账本选择行：
   两态（选用户/建用户）共用，点击切换目标账本并重拉其用户（enter 写 chaimi_ledger/chaimi_user 都以 LEDGER 为准，闭环） */
function ledBar(){
  return `<div class="lg-lbs">${LEDGERS.map(l =>
    `<button class="lg-lb${l.id===LEDGER?" on":""}" onclick="switchLedger(${l.id})">${l.icon?esc(l.icon)+" ":""}${esc(l.name)}</button>`).join("")}</div>`;
}
async function switchLedger(id){
  if(id === LEDGER) return;
  LEDGER = id; LNAME = LEDGERS.find(l=>l.id===id)?.name || "";
  try{ SAVED = +localStorage.getItem("chaimi_user_" + LEDGER) || 0; }catch(_){}
  render(`<div class="lg-sub">加载中…</div>`);
  try{ USERS = await api(`api/attribution-groups?ledger=${LEDGER}`); }
  catch(_){ USERS = []; }
  render(USERS.length ? selHtml() : setupHtml(false));
}
function render(html){
  $("#lgPanel").innerHTML = html;
}
function head(){ return `<div class="lg-mhead"><img src="images/icon-256.png" alt=""></div>`; }
/* 状态 C：一本账本都没有（新飞牛用户/全新安装）——先建账本再进建用户流程 */
function newLedgerHtml(){
  return `${head()}
    <div class="lg-h1">欢迎使用 👋</div>
    <div class="lg-sub">还没有账本，先建一本——日常 / 旅行 / 装修都可以，之后在设置页还能继续添加。</div>
    <div class="lg-label"><span>账本名</span></div>
    <input id="lg_ledger_name" class="lg-input" placeholder="如：日常" oninput="this.classList.remove('lg-err')">
    <button class="lg-go" onclick="createLedger()">创建账本 →</button>
    <div class="lg-foot">创建后设置第一个记账用户</div>`;
}
async function createLedger(){
  try{
    const name = ($("#lg_ledger_name").value || "").trim() || "日常";
    const r = await apiSend("api/ledgers", "POST", {name, currency: "CNY"});
    try{ localStorage.setItem("chaimi_ledger", String(r.id)); }catch(_){}
    LEDGER = r.id; LNAME = name; LEDGERS = [{id: r.id, name, icon: ""}];
    render(setupHtml(false));   // 建完账本接着走「设置第一个用户」
  }catch(e){ msg(e.message); }
}
let lgAvatar = "f";
let lgFromList = false;
function setupHtml(fromList){   // 状态 A：设置用户名（必填）+ 头像；fromList=从选择页「＋新建用户」进入
  lgAvatar = "f";
  lgFromList = !!fromList;
  return `${head()}
    ${ledBar()}
    ${fromList ? `<button class="lg-back" onclick="back()">‹ 返回选择用户</button>` : ""}
    <div class="lg-h1">欢迎使用${fromList ? "" : " 👋"}</div>
    <div class="lg-sub">${fromList
      ? "填写用户名创建新用户；不填直接点「开始记账」则沿用上次用户进入。"
      : "先设置一个用户名——记账会默认记在当前用户名下，家人可稍后在「设置 → 用户设置」里添加。"}</div>
    <div class="lg-label"><span>头像</span></div>
    <div class="lg-avatars">
      <button type="button" class="lg-avpick" data-av="m" onclick="pickAv(this)"><img src="images/avatar-cow-m.png" alt="男牛牛"></button>
      <button type="button" class="lg-avpick on" data-av="f" onclick="pickAv(this)"><img src="images/avatar-cow-f.png" alt="女牛牛"></button>
    </div>
    <div class="lg-label"><span>用户名</span>${fromList ? "" : '<span class="lg-req">必填</span>'}</div>
    <input id="lg_name" class="lg-input" placeholder="如：老公 / 老婆 / 我" oninput="this.classList.remove('lg-err')">
    <button class="lg-go" onclick="create()">开始记账 →</button>
    <div class="lg-foot">头像可稍后在「设置 → 用户设置」里更换</div>`;
}
function pickAv(btn){
  lgAvatar = btn.dataset.av;
  document.querySelectorAll(".lg-avpick").forEach(b=>b.classList.toggle("on", b===btn));
}
function avCell(g){   // 用户卡头像：牛牛（历史空值兜底为女牛）
  return `<img class="lg-avimg" src="images/avatar-cow-${g.avatar==="m"?"m":"f"}.png" alt="">`;
}
function selHtml(){   // 状态 B：选择用户（上次使用的排最前并标注）
  const gs = [...USERS].sort((a,b)=>(b.id===SAVED)-(a.id===SAVED));
  return `${head()}
    ${ledBar()}
    <div class="lg-h1">选择用户</div>
    <div class="lg-sub">选择记账人进入「${esc(LNAME)}」（每个账本的用户独立）。</div>
    <div class="lg-ulist">
      ${gs.map(g=>`
      <button class="lg-uitem" onclick="pick(${g.id})">
        ${avCell(g)}
        <span class="lg-uinfo"><span class="lg-uname">${esc(g.name)}</span>
          <span class="lg-umeta">${g.id===SAVED ? "上次使用 · " : ""}${g.members ? esc(g.members) : "暂无账单归属"}</span></span>
        <span class="lg-uarrow">›</span>
      </button>`).join("")}
      <button class="lg-uitem lg-uadd" onclick="newUser()">＋ 新建用户</button>
    </div>
    <div class="lg-foot" style="margin-top:18px">选择后记住在本设备，下次直接进入记账页</div>`;
}
const back = () => render(selHtml());
const newUser = () => render(setupHtml(true));
function enter(id){
  // 主应用 loadAll 首载读它恢复——修复「新账本建用户，进入后却回到旧账本」
  try{
    localStorage.setItem("chaimi_user_" + LEDGER, String(id));
    localStorage.setItem("chaimi_ledger", String(LEDGER));
    if(localStorage.getItem("chaimi_user_" + LEDGER) !== String(id)) throw 0;   // 写被拒（禁存储）
  }catch(_){ msg("本浏览器禁止本地存储，无法记住用户，请更换浏览器或关闭隐私模式"); return; }
  location.replace(".");
}
const pick = id => enter(id);
async function create(){
  const name = $("#lg_name").value.trim();
  if(!name){
    if(lgFromList && USERS.length){
      enter((USERS.find(g=>g.id===SAVED) || USERS[0]).id);
      return;
    }
    $("#lg_name").classList.add("lg-err"); return msg("请设置用户名");
  }
  try{
    const r = await apiSend(`api/attribution-groups?ledger=${LEDGER}`, "POST", {name, avatar: lgAvatar});
    enter(r.id);
  }catch(e){ msg(e.message); }
}
boot();
</script>
</body>
</html>
